# Frozen before running any benchmark/analysis (research brief section
# 16): categories and members were fixed first, so nothing here was
# picked after the fact because it produced a nicer-looking result.
#
# All values are either well-known textbook-weak password EXAMPLES (the
# same kind of generic "123456"/"password" strings used in virtually
# every public password-security teaching resource -- not anyone's real
# credential) or freshly CSPRNG-generated random strings. None of these
# are, or were ever, a real account's actual password.
#
# Categories (research brief section 16):
#   A. common/breached
#   B. traditional complexity-rule variants
#   C. long predictable phrases
#   D. long uncommon passphrases
#   E. uniformly random CSPRNG-generated
version: 1
passwords:
  - { id: A01, category: common-breached, generation: synthetic, password: "123456" }
  - { id: A02, category: common-breached, generation: synthetic, password: "password" }
  - { id: A03, category: common-breached, generation: synthetic, password: "qwerty123" }
  - { id: A04, category: common-breached, generation: synthetic, password: "letmein" }
  - { id: A05, category: common-breached, generation: synthetic, password: "iloveyou" }

