description:
  short: "A lab demonstration of password hash cracking with John the Ripper and Johnny, using dummy hashes and a CUPP-generated wordlist."
  long: |
    A presentation-based lab demonstration walking through generating a
    dummy MD5 password hash, building a custom wordlist with CUPP, and
    cracking the dummy hash with both John the Ripper (CLI) and Johnny
    (GUI). Also covers cracking password-protected ZIP/PDF files
    (zip2john/pdf2john) and mitigations (salting, adaptive hashing like
    bcrypt/scrypt/Argon2, MFA, rate limiting). Built for an Introduction to
    Cyber Security course (Air University, Semester 1, Fall 2023), scoped
    explicitly to dummy hashes in a controlled lab.

