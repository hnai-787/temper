name: pwaudit CI

on:
  push:
    paths:
      - "pwaudit/**"
      - ".github/workflows/pwaudit-ci.yml"
  pull_request:
    paths:
      - "pwaudit/**"
      - ".github/workflows/pwaudit-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: pwaudit

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: ruff check src tests

      - name: Test (pytest) -- no John installation required
        run: pytest -q

      - name: Regenerate the analysis report
        run: |
          pwaudit analyze experiments/experiment.yaml --policy-file experiments/policy-nist-conformant.yaml --format markdown -o /tmp/report.md
          pwaudit policy-audit experiments/policy-nist-conformant.yaml
